<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Queue</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Campus Queue</h1>
  <p>Pick a counter, join the queue, watch your place in line.</p>
  <label>Counter
    <select id="counter"></select>
  </label>
  <label>Your name
    <input id="name" type="text" placeholder="e.g. Ananya">
  </label>
  <button id="join">Join the queue</button>
  <p id="status"></p>
  <ol id="board"></ol>
  <button id="refresh">Refresh board</button>
</main>
<script src="app.js"></script>
</body>
</html>
